# Local dev infra only — MariaDB + Redis (docs/reference/MONOREPO_ARCHITECTURE.md).
# App itself runs on the host via `pnpm dev` (Module 00 DoD), not in a container.
# Credentials here match .env.example; override in .env, not here.
services:
  mariadb:
    image: mariadb:11.4
    container_name: mbfx-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: mbfx_learning_center
      MARIADB_USER: user
      MARIADB_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # Runs once, on a fresh volume: grants the app user rights on the
      # databases the E2E suite creates for itself (docker/mariadb-init).
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mbfx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mail catcher for development and the @repo/email integration suite
  # (Module 17, ADR-078). Nothing it receives leaves this machine: point
  # EMAIL settings at localhost:1025 and read the mail at localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mbfx-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI + API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
  redis_data:
